<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc">
<title id="title">Finding a tool is not the same as being able to run it</title>
<desc id="desc">With optional tool filtering enabled, the model's direct tool list keeps built-ins and available tools while unavailable external tools are withheld. Tools reached indirectly through search or generated code remain discoverable; a short notice names the available indirect tools or groups, without overriding the direct list. Every direct or nested call is checked before execution. An eligible tool not yet scored can be scored once at this point. Available calls run; unavailable calls return an error. This is relevance filtering, not a sandbox: discovery, MCP connections, shell commands and other processes are not restricted.</desc>
<defs>
  <linearGradient id="header" x2="1" y2="1"><stop stop-color="#142b4a"/><stop offset="1" stop-color="#263657"/></linearGradient>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#647994" stroke-width="2" stroke-linejoin="round"/></marker>
  <style>
    text { font-family: Lato, 'DejaVu Sans', sans-serif; fill: #22344e; }
    .body { font-size: 25px; }
    .flow { fill: none; stroke: #647994; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .join { fill: none; stroke: #647994; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</defs>
<rect width="1200" height="1020" rx="24" fill="#f5f7fc"/>
<rect x="24" y="24" width="1152" height="124" rx="22" fill="url(#header)"/>
<text x="56" y="55" style="font-size:19px;fill:#91e3d0;font-weight:800;letter-spacing:1px;">03 / TOOL LIST VS. TOOL EXECUTION</text>
<text x="56" y="94" style="font-size:40px;fill:#ffffff;font-weight:800;">Finding a tool ≠ being able to run it</text>
<text x="56" y="128" style="font-size:24px;fill:#d4e0f1;">Tool filtering is optional and off by default.</text>

<rect x="56" y="180" width="1088" height="82" rx="18" fill="#e5f6ef" stroke="#a9d9c5" stroke-width="1.5"/>
<text x="600" y="232" style="font-size:29px;fill:#1d7358;font-weight:800;" text-anchor="middle">Selected tools, MCP-server groups or extension groups</text>
<path class="flow" d="M 600 262 V 292 H 313 V 324"/>
<path class="flow" d="M 600 292 H 887 V 324"/>

<rect x="56" y="324" width="514" height="184" rx="18" fill="#eaf2ff" stroke="#b9cff3" stroke-width="1.5"/>
<rect x="57" y="342" width="4" height="148" rx="2" fill="#2457a7"/>
<text x="80" y="367" style="font-size:28px;fill:#2457a7;font-weight:800;">Listed directly for the model</text>
<text x="80" y="408" class="body">Keep built-ins and available tools.</text>
<text x="80" y="443" class="body">Withhold unavailable external tools.</text>
<text x="80" y="478" class="body">The notice does not change this list.</text>

<rect x="630" y="324" width="514" height="184" rx="18" fill="#eaf2ff" stroke="#b9cff3" stroke-width="1.5"/>
<rect x="631" y="342" width="4" height="148" rx="2" fill="#2457a7"/>
<text x="654" y="367" style="font-size:28px;fill:#2457a7;font-weight:800;">Reached through search or code</text>
<text x="654" y="408" class="body">Search still finds all tools.</text>
<text x="654" y="443" class="body">A notice names the available ones.</text>
<text x="654" y="478" class="body">It describes indirect tools only.</text>

<path class="join" d="M 313 508 V 542 H 887 V 508"/>
<path class="flow" d="M 600 542 V 574"/>
<rect x="56" y="574" width="1088" height="144" rx="18" fill="#fff4df" stroke="#e8ca8d" stroke-width="1.5"/>
<rect x="57" y="592" width="4" height="108" rx="2" fill="#97621a"/>
<text x="84" y="620" style="font-size:32px;fill:#97621a;font-weight:800;">Every call is checked before the tool runs</text>
<text x="84" y="660" class="body">Also calls inside code generated by the model.</text>
<text x="84" y="696" style="font-size:24px;fill:#97621a;">New, unscored tool? It can be picked now, once.</text>
<path class="flow" d="M 600 718 V 746 H 313 V 774"/>
<path class="flow" d="M 600 746 H 887 V 774"/>

<rect x="56" y="774" width="514" height="90" rx="18" fill="#e5f6ef" stroke="#a9d9c5" stroke-width="1.5"/>
<text x="313" y="829" style="font-size:29px;fill:#1d7358;font-weight:800;" text-anchor="middle">Available → run the tool</text>
<rect x="630" y="774" width="514" height="90" rx="18" fill="#ffeded" stroke="#edbcbc" stroke-width="1.5"/>
<text x="887" y="829" style="font-size:28px;fill:#a63e48;font-weight:800;" text-anchor="middle">Unavailable → return an error</text>

<rect x="56" y="908" width="1088" height="86" rx="18" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<text x="84" y="943" style="font-size:28px;fill:#97621a;font-weight:800;">Relevance filtering, not a sandbox</text>
<text x="84" y="977" style="font-size:25px;fill:#52647d;">Discovery, MCP connections and shell commands are not restricted.</text>
</svg>
