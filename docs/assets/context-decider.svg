<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc">
<title id="title">Select the remaining. Preserve the rest.</title>
<desc id="desc">Local task text, inventories, scoped allowlists and active-branch ledgers feed two independent pipelines. Skills exclude prior advertisements and pins. Tools mode scores each remaining external tool; mcp mode scores whole MCP or extension groups. Only bounded task text and the specified names/descriptions/labels reach the decision provider, never bodies, schemas, arguments or results. Qualifying scores are ranked globally across shards and capped per round. Stable skills go in the system base; added skills are hidden user-role deltas. Declared tools are reconciled through setActiveTools; indirect availability is announced by a names-only hidden message. Committed grants are additive.</desc>
<defs>
  <linearGradient id="header" x2="1" y2="1"><stop stop-color="#142b4a"/><stop offset="1" stop-color="#263657"/></linearGradient>
  <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#647994" stroke-width="2" stroke-linejoin="round"/></marker>
  <style>
    text { font-family: Lato, 'DejaVu Sans', sans-serif; fill: #22344e; }
    .title { font-size: 24px; font-weight: 800; }
    .body { font-size: 20px; }
    .small { font-size: 18px; fill: #52647d; }
    .mono { font-family: 'DejaVu Sans Mono', monospace; font-size: 18px; }
    .flow { fill: none; stroke: #647994; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
  </style>
</defs>
<rect width="1200" height="1130" rx="24" fill="#f5f7fc"/>
<rect x="24" y="24" width="1152" height="116" rx="22" fill="url(#header)"/>
<text x="56" y="53" style="font-size:14px;fill:#91e3d0;font-weight:800;" letter-spacing="2">02 / METADATA → CONTEXT</text>
<text x="56" y="89" style="font-size:34px;fill:#ffffff;font-weight:800;">Select the remaining. Preserve the rest.</text>
<text x="56" y="119" style="font-size:18px;fill:#d4e0f1;">Independent skill and tool pipelines · shared decision provider, threshold and execution settings</text>
<rect x="56" y="166" width="1088" height="100" rx="18" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5"/>
<rect x="57" y="184" width="4" height="64" rx="2" fill="#52647d" stroke="none" stroke-width="1.5"/>
<text x="80" y="203" style="font-size:25px;fill:#52647d;font-weight:800;">Local inputs · task + inventories + branch state</text>
<text x="80" y="236" style="font-size:20px;">Latest bounded USER text · scoped allowlists · committed active-branch ledgers</text>
<path class="flow" d="M 600 266 V 286 H 313 V 318"/>
<path class="flow" d="M 600 286 H 887 V 318"/>
<rect x="56" y="318" width="514" height="164" rx="18" fill="#e5f6ef" stroke="#a9d9c5" stroke-width="1.5"/>
<rect x="57" y="336" width="4" height="128" rx="2" fill="#1d7358" stroke="none" stroke-width="1.5"/>
<circle cx="87" cy="348" r="14" fill="#1d7358"/>
<text x="87" y="353" style="font-size:15px;fill:#ffffff;font-weight:800;" text-anchor="middle">1</text>
<text x="111" y="355" style="font-size:23px;fill:#1d7358;font-weight:800;">Skills · preserve advertisements</text>
<text x="80" y="388" style="font-size:20px;">Keep the base, prior additions and pins.</text>
<text x="80" y="415" style="font-size:20px;">Score only unadvertised, invocable skills.</text>
<text x="80" y="442" style="font-size:20px;">Pins bypass scoring, threshold and cap.</text>
<rect x="630" y="318" width="514" height="164" rx="18" fill="#e5f6ef" stroke="#a9d9c5" stroke-width="1.5"/>
<rect x="631" y="336" width="4" height="128" rx="2" fill="#1d7358" stroke="none" stroke-width="1.5"/>
<circle cx="661" cy="348" r="14" fill="#1d7358"/>
<text x="661" y="353" style="font-size:15px;fill:#ffffff;font-weight:800;" text-anchor="middle">1</text>
<text x="685" y="355" style="font-size:22px;fill:#1d7358;font-weight:800;">Tools / MCP · preserve availability</text>
<text x="654" y="388" style="font-size:20px;">Keep prior grants + scoped allowlists.</text>
<text x="654" y="415" style="font-size:20px;">tools: individual external tools.</text>
<text x="654" y="442" style="font-size:20px;">mcp: whole MCP-server OR extension groups.</text>
<path class="flow" d="M 313 482 V 522"/>
<path class="flow" d="M 887 482 V 522"/>
<rect x="56" y="522" width="514" height="164" rx="18" fill="#f0ebff" stroke="#d2c5f4" stroke-width="1.5"/>
<rect x="57" y="540" width="4" height="128" rx="2" fill="#6d46b5" stroke="none" stroke-width="1.5"/>
<circle cx="87" cy="552" r="14" fill="#6d46b5"/>
<text x="87" y="557" style="font-size:15px;fill:#ffffff;font-weight:800;" text-anchor="middle">2</text>
<text x="111" y="559" style="font-size:23px;fill:#6d46b5;font-weight:800;">Decision-provider payload</text>
<text x="80" y="592" style="font-size:20px;">Bounded user task</text>
<text x="80" y="619" style="font-size:20px;">+ skill names and descriptions only.</text>
<text x="80" y="646" style="font-size:20px;">No bodies, locations or transcripts.</text>
<rect x="630" y="522" width="514" height="164" rx="18" fill="#f0ebff" stroke="#d2c5f4" stroke-width="1.5"/>
<rect x="631" y="540" width="4" height="128" rx="2" fill="#6d46b5" stroke="none" stroke-width="1.5"/>
<circle cx="661" cy="552" r="14" fill="#6d46b5"/>
<text x="661" y="557" style="font-size:15px;fill:#ffffff;font-weight:800;" text-anchor="middle">2</text>
<text x="685" y="559" style="font-size:23px;fill:#6d46b5;font-weight:800;">Decision-provider payload</text>
<text x="654" y="592" style="font-size:19px;">Bounded user task + metadata only:</text>
<text x="654" y="619" style="font-size:19px;">tools: name, description, server/extension label.</text>
<text x="654" y="646" style="font-size:19px;">mcp: group key, label, MCP summary, tool names.</text>
<path class="flow" d="M 313 686 V 728"/>
<path class="flow" d="M 887 686 V 728"/>
<rect x="56" y="728" width="1088" height="100" rx="18" fill="#f0ebff" stroke="#d2c5f4" stroke-width="1.5"/>
<rect x="57" y="746" width="4" height="64" rx="2" fill="#6d46b5" stroke="none" stroke-width="1.5"/>
<circle cx="87" cy="758" r="14" fill="#6d46b5"/>
<text x="87" y="763" style="font-size:15px;fill:#ffffff;font-weight:800;" text-anchor="middle">3</text>
<text x="111" y="765" style="font-size:26px;fill:#6d46b5;font-weight:800;">Score 0–2 · accept ≥ 2 × threshold · default ≥ 0.75</text>
<text x="80" y="798" style="font-size:20px;">Rank across all shards. Default NEW-addition caps: skills 12 · tools/groups 8. Reuse same-task scores.</text>
<path class="flow" d="M 313 828 V 870"/>
<path class="flow" d="M 887 828 V 870"/>
<rect x="56" y="870" width="514" height="138" rx="18" fill="#eaf2ff" stroke="#b9cff3" stroke-width="1.5"/>
<rect x="57" y="888" width="4" height="102" rx="2" fill="#2457a7" stroke="none" stroke-width="1.5"/>
<circle cx="87" cy="900" r="14" fill="#2457a7"/>
<text x="87" y="905" style="font-size:15px;fill:#ffffff;font-weight:800;" text-anchor="middle">4</text>
<text x="111" y="907" style="font-size:23px;fill:#2457a7;font-weight:800;">Deliver skill context</text>
<text x="80" y="940" style="font-size:20px;">Stable base → system skills section.</text>
<text x="80" y="967" style="font-size:20px;">New / re-delivered → hidden user-role delta.</text>
<text x="80" y="994" style="font-size:20px;">Pi formatSkillsForPrompt; no skill bodies.</text>
<rect x="630" y="870" width="514" height="138" rx="18" fill="#eaf2ff" stroke="#b9cff3" stroke-width="1.5"/>
<rect x="631" y="888" width="4" height="102" rx="2" fill="#2457a7" stroke="none" stroke-width="1.5"/>
<circle cx="661" cy="900" r="14" fill="#2457a7"/>
<text x="661" y="905" style="font-size:15px;fill:#ffffff;font-weight:800;" text-anchor="middle">4</text>
<text x="685" y="907" style="font-size:23px;fill:#2457a7;font-weight:800;">Deliver tool availability</text>
<text x="654" y="940" style="font-size:20px;">Direct/model-only → active declarations.</text>
<text x="654" y="967" style="font-size:20px;">Indirect → hidden, names-only user-role notice.</text>
<text x="654" y="994" style="font-size:20px;">All calls → tool_call gate (next diagram).</text>
<text x="56" y="1048" style="font-size:19px;fill:#52647d;">Tool internals bypass scoring (by Pi provenance). mcp mode also leaves ungrouped extension tools unfiltered.</text>
<text x="56" y="1076" style="font-size:19px;fill:#52647d;">No model / below minimum: keep all, no scoring. A failed decision adds nothing by default; earlier grants survive.</text>
<text x="56" y="1104" style="font-size:18px;fill:#52647d;">No schemas, annotations, namespace instructions, server configs, arguments, results or assistant text reach the decider.</text>
</svg>
