name: Publish changelog

# Independent of npm publishing: release notes remain available even if npm fails.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish/repair (leave empty to only rebuild CHANGELOG.md)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      # Use current automation, even when repairing an older release tag.
      - name: Checkout default branch with all tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false # never cache release automation builds

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test changelog generator
        run: node --experimental-strip-types --test test/changelog*.test.ts

      - name: Publish GitHub Release and update CHANGELOG.md
        run: npm run changelog -- --publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHANGELOG_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

      # Do not serialize tag runs with global Actions concurrency: it can cancel
      # pending tags. The generator retries conflicting changelog file updates.
      - name: Upload cumulative changelog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ github.run_id }}-${{ github.run_attempt }}
          path: CHANGELOG.md
          if-no-files-found: warn
